plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.godsarmy.mlhtmltranslator.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.godsarmy.mlhtmltranslator.sample'
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName '0.8.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def mlkitTranslateVersion = project.findProperty('mlkitTranslateVersion') ?: '17.0.3'
    def jsoupVersion = project.findProperty('jsoupVersion') ?: '1.17.2'

    implementation project(':library')
    implementation "com.google.mlkit:translate:${mlkitTranslateVersion}"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "org.jsoup:jsoup:${jsoupVersion}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
